; PHP fuer das SQL-Labor (nur der eingebaute Webserver fuer Adminer).
; extension_dir setzt START.bat per -d auf den absoluten Pfad.
extension=mysqli
extension=mbstring
memory_limit = 256M
max_execution_time = 0
upload_max_filesize = 64M
post_max_size = 64M
display_errors = Off
log_errors = On
date.timezone = Europe/Berlin
default_charset = "UTF-8"
