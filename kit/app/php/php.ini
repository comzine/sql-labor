; PHP fuer das SQL-Labor: eingebaute Webserver fuer phpMyAdmin (18080) und fuer
; die Seiten der SuS (18000). extension_dir setzt START.bat per -d auf den
; absoluten Pfad; der SuS-Server bekommt zusaetzlich display_errors=1.
extension=mysqli
extension=pdo_mysql
extension=mbstring
extension=fileinfo
memory_limit = 256M
max_execution_time = 0
upload_max_filesize = 64M
post_max_size = 64M
display_errors = Off
log_errors = On
date.timezone = Europe/Berlin
default_charset = "UTF-8"
; Ohne Angaben verbindet mysqli zur Datenbank des Kits (127.0.0.1:13306).
mysqli.default_host = 127.0.0.1
mysqli.default_port = 13306
